services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - foxwords_edge
      - foxwords_private
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4000"
      DB_FILE: /data/foxwords.db
      SETTINGS_FILE: /data/settings.json
      STORY_LIMIT: ${STORY_LIMIT:-10}
      # Corvus API v1. The key is a file secret, never an environment value.
      CORVUS_API_BASE_URL: ${CORVUS_API_BASE_URL:-}
      CORVUS_API_KEY_FILE: /run/secrets/corvus_api_key
      CORVUS_TIMEOUT_MS: ${CORVUS_TIMEOUT_MS:-100000}
      CORVUS_MAX_PER_MINUTE: ${CORVUS_MAX_PER_MINUTE:-4}
    volumes:
      - ./data:/data
    secrets:
      - corvus_api_key
    networks:
      - foxwords_private
      # Outbound HTTPS to the Corvus API edge. No ports are published.
      - foxwords_egress
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Legacy local model. Not used by the backend since the Corvus integration;
  # starts only with `--profile local-llm`.
  llama-server:
    profiles: ["local-llm"]
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    restart: unless-stopped
    command:
      - -m
      - /models/${LLAMA_MODEL_FILE:-unset.gguf}

      - --alias
      - ${LLAMA_MODEL:-foxwords}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -ngl
      - ${LLAMA_GPU_LAYERS:-99}
      - -c
      - ${LLAMA_CONTEXT_SIZE:-4096}
      - -np
      - ${LLAMA_PARALLEL:-1}
    volumes:
      - /home/ethan/srv/shared/models:/models:ro
    gpus: all
    networks:
      - foxwords_private
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s

networks:
  foxwords_edge: {}
  foxwords_egress: {}
  foxwords_private:
    internal: true

secrets:
  corvus_api_key:
    # Host path of the FoxWords Corvus key (mode 0600, outside this repo).
    file: ${CORVUS_API_KEY_HOST_FILE:?Set CORVUS_API_KEY_HOST_FILE in .env.deploy}
