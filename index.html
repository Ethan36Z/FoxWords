<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7fb" />
    <title>FoxWords · 背单词</title>
    <script>
      // Apply saved theme + font size before first paint (see src/appearance.js)
      try {
        var a = JSON.parse(localStorage.getItem("foxwords_appearance") || "{}");
        if (a.followSystem === false && a.theme) document.documentElement.dataset.theme = a.theme;
        if (a.fontSize) document.documentElement.dataset.fontSize = a.fontSize;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
